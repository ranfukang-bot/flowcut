name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            gemini-web-workbench/package-lock.json
            vendor/publisher/package-lock.json
      - run: npm ci
      - run: npm ci --prefix gemini-web-workbench
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm ci --prefix vendor/publisher
      - name: Install media tools for real dual-video tests
        run: choco install ffmpeg --yes --no-progress
      - run: npm run verify
