<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>FlowCut 正在启动</title>
    <style>
      :root { font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif; background: #0e1014; color: #e9ecf1; color-scheme: dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(520px, calc(100% - 40px)); box-sizing: border-box; padding: 40px; border: 1px solid #272c36; border-radius: 16px; background: #161920; box-shadow: 0 24px 80px rgba(0,0,0,.45); text-align: center; }
      i { display: grid; place-items: center; width: 56px; height: 56px; margin: 0 auto 20px; border-radius: 14px; background: #f2b13c; color: #1a1300; font-size: 26px; font-style: normal; font-weight: 800; }
      h1 { margin: 0 0 10px; font-size: 22px; }
      p { margin: 0; color: #a3abb8; line-height: 1.7; }
      #error { margin-top: 15px; color: #f47171; }
      #error.blocked { text-align: left; white-space: pre-line; }
      form { display: grid; gap: 15px; margin-top: 28px; text-align: left; }
      label { display: grid; gap: 7px; color: #b4bbc6; font-size: 13px; font-weight: 700; }
      input { min-height: 44px; box-sizing: border-box; border: 1px solid #323844; border-radius: 8px; outline: none; padding: 0 12px; color: #e9ecf1; background: #1c2028; font: inherit; }
      input:focus { border-color: #f2b13c; box-shadow: 0 0 0 3px rgba(242,177,60,.14); }
      button { min-height: 46px; margin-top: 3px; border: 0; border-radius: 8px; background: #f2b13c; color: #1a1300; cursor: pointer; font-size: 14px; font-weight: 700; }
      button:disabled { cursor: wait; opacity: .55; }
      small { display: block; margin-top: 18px; color: #8f97a4; font-size: 12px; line-height: 1.55; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <i>F</i>
      <div id="loading">
        <h1>正在启动 FlowCut</h1>
        <p>个人本机版 · 正在启动商品库与视频工作台…</p>
      </div>
      <p id="error"></p>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const errorBox = document.getElementById("error");
      const error = params.get("error");
      if (error) errorBox.textContent = error;
      if (error && params.get("blocked") === "1") {
        // Data protection stop: nothing is loading, so do not say it is.
        document.title = "FlowCut 已停止启动";
        document.querySelector("#loading h1").textContent = "需要先处理本机数据文件";
        document.querySelector("#loading p").textContent =
          "为保护账号、密钥和任务数据，FlowCut 没有继续启动，也没有改动这些文件。";
        errorBox.className = "blocked";
      }
    </script>
  </body>
</html>
